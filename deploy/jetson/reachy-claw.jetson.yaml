llm:
  backend: edge_llm_v2v
  # TensorRT-Edge-LLM OpenAI-compatible HTTP endpoint.
  # TODO: edge-llm-chat-service is not yet bundled into deploy/jetson/.
  #   When that container lands, point edge_llm_url at its host port and
  #   pin edge_llm_model to the served model name (or leave blank for
  #   auto-discovery via GET /v1/models).
  edge_llm_url: http://localhost:8080
  edge_llm_model: ""   # empty = auto-discover

# V2V (ASR + VAD + TTS) is served by the existing Jetson speech container
# at :8621. Other v2v_* fields fall back to config.py defaults
# (asr_language=auto, vad=silero, vad_silence_ms=700, multi_utterance=true).
v2v:
  url: ws://localhost:8621/v2v/stream

# Note: with backend=edge_llm_v2v, top-level stt/tts/vad blocks below are
# ignored at runtime (the server owns ASR/VAD/TTS). They are kept for now
# so falling back to backend=ollama via env override doesn't lose its
# configuration.
stt:
  backend: paraformer-streaming
  speech_service_url: http://localhost:8621

tts:
  backend: matcha
  speech_service_url: http://localhost:8621
  matcha:
    speaker_id: 3       # af_heart
    speed: 0.8
    pitch_shift: 1.5    # +1.5 semitones

vad:
  backend: silero

barge_in:
  enabled: true
  # Tuned for Reachy Mini speaker + close-range mic
  confirm_frames: 2
  energy_threshold: 0.03
  silero_threshold: 0.5
  cooldown_ms: 300

audio:
  device: "Reachy Mini Audio"
  volume: 5.0

reachy:
  serialport: auto
  spawn_daemon: false  # daemon runs as separate container
  connection_mode: localhost_only
  daemon_port: 38001
  media_backend: gstreamer

vision:
  camera_source: sdk
  tracker: remote

dashboard:
  enabled: true
  port: 8640

plugins:
  face_tracker: true
