# Reachy Voice — the ONE deploy file (no parallel trees).
#
# Assumes the supporting services (reachy-daemon :38001, SLV :8621,
# edge-llm :11435, vision-trt) run from their own composes, all on the host
# network. This only manages the voice app itself.
#
# Usage (on the robot, from the repo root):
#   docker compose -f deploy/jetson/voice/docker-compose.yml up -d --build
# Rollback: docker compose -f deploy/jetson/voice/docker-compose.yml down
#
# NOTE: this manages the reachy-voice APP only. The SLV speech backend it talks
# to (image seeed-local-voice, :8621) is a separate artifact — see
# docker-compose.slv-backend.yml in this same directory.

services:
  reachy-voice:
    image: reachy-voice:v0.4.0
    build:
      # Repo root is the build context so the Dockerfile can COPY src/reachy_voice
      # and hf-hub (both repo-root-relative).
      context: ../../..
      dockerfile: deploy/jetson/voice/Dockerfile
    container_name: reachy-voice
    restart: unless-stopped
    network_mode: host
    privileged: true            # ALSA audio device + udev
    volumes:
      - /dev/shm:/dev/shm
      - /run/udev:/run/udev:ro
      # Dashboard "restart services" drives the Docker Engine API over this socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # Runtime overrides (bargein / VAD / memory / language) the operator sets
      # from the dashboard. Bind-mounted to a stable host path so they survive
      # `docker restart` AND image rebuilds, and stay hand-inspectable over SSH.
      # Applying this mount needs one `compose up` (not just a restart).
      - /home/recomputer/reachy-voice-data:/data
    environment:
      - NO_PROXY=localhost,127.0.0.1
      - REACHY_DAEMON_PORT=38001
      - REACHY_LOG_LEVEL=INFO
      - REACHY_VOICE_DATA_DIR=/data
      # - REACHY_LANGUAGE=zh    # default; switchable at runtime via :8042
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
