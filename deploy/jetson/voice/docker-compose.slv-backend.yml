# Seeed Local Voice — SLV V2V backend for reachy-voice (Jetson Orin NX).
#
# The v0.9.0 voice stack: Qwen3-ASR 0.6B int4 (edgellm v090) + MOSS-TTS-Nano
# TTS, driving the LLM/tool loop SERVER-SIDE so reachy-voice stays a
# provider-neutral Realtime V2 device client (REACHY_SERVER_LOOP=1 on the app).
#
# Usage (standalone speech service; edge-llm + reachy-voice run separately):
#   docker compose -f deploy/jetson/voice/docker-compose.slv-backend.yml up -d
#
# Engines are NOT baked: the ASR pair + worker + plugin (~1.3 GB) land in the
# edgellm-v090 volume and the MOSS engines (~1.9 GB) in speech-models, both
# fetched on first boot and md5-verified against the baked manifest. First
# start therefore takes several minutes; subsequent boots re-verify only.
# China networks: set HF_ENDPOINT=https://hf-mirror.com.
#
# NOTE: Jetson target only. RK and Raspberry Pi have their own compose files.

services:
  speech:
    image: sensecraft-missionpack.seeed.cn/solution/seeed-local-voice:v0.9.0-ondemand-20260721c
    runtime: nvidia
    ipc: host
    network_mode: host
    env_file:
      - path: ${REACHY_VOICE_HOST_DATA_DIR:-/home/recomputer/reachy-voice-data}/speech.env
        required: false
    environment:
      - OVS_PROFILE=${OVS_PROFILE:-jetson-edgellm-v090-moss}
      - OVS_PROFILE_JSON=${OVS_PROFILE_JSON:-}
      - LANGUAGE_MODE=${LANGUAGE_MODE:-multilanguage}
      # ── Server-loop: the gateway owns the LLM + tool loop ──────────────
      # Both keys are required — one without the other does NOT close the v2v
      # spoken-reply loop (see seeed-local-voice docs/CONFIGURATION.md). The
      # reachy-voice client mirrors this with REACHY_SERVER_LOOP=1. EDGE_LLM_*
      # point the gateway at the edge-llm container; override for your topology
      # (bridge → http://172.17.0.1:11435/v1, host-net → http://localhost:11435/v1).
      - OVS_V2V_ENGINE=${OVS_V2V_ENGINE:-voxedge}
      - OVS_V2V_SERVER_LOOP=${OVS_V2V_SERVER_LOOP:-1}
      - EDGE_LLM_BASE_URL=${EDGE_LLM_BASE_URL:-http://localhost:11435/v1}
      - EDGE_LLM_MODEL=${EDGE_LLM_MODEL:-Qwen/Qwen3-4B-AWQ}
      # SLV runs bridge-net here, so host calls are not loopback → admin key
      # is required for the gateway's own control calls.
      - OVS_ADMIN_KEY=${OVS_ADMIN_KEY:-}
      # MOSS artifacts (~1.9 GB) are provisioned into speech-models on first
      # boot; md5s are verified against the baked manifest.
      - MOSS_ARTIFACT_AUTO_DOWNLOAD=${MOSS_ARTIFACT_AUTO_DOWNLOAD:-1}
      # Open-dialogue endpointing. Override in .env for product tuning.
      - OVS_VAD_BACKEND=${OVS_VAD_BACKEND:-silero}
      - OVS_VAD_SILENCE_MS=${OVS_VAD_SILENCE_MS:-400}
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
      # MOSS has no native speed knob; 1.0 = transparent. The reachy-voice
      # client applies pitch-preserving speed via voxedge's TTSRateShifter,
      # driven by REACHY_TTS_SPEED — so leave the server pass-through at 1.0.
      - TTS_PROVIDER=${TTS_PROVIDER:-cuda}
      - TTS_DEFAULT_SPEED=${TTS_DEFAULT_SPEED:-1.0}
      - TTS_NUM_THREADS=4
      - PARAFORMER_PREROLL_MS=${PARAFORMER_PREROLL_MS:-100}
      - STREAMING_ASR_PROVIDER=cuda
      - STREAMING_ASR_NUM_THREADS=4
      - CUDA_MODULE_LOADING=LAZY
      - LD_LIBRARY_PATH=/usr/local/lib/python3.10/dist-packages/onnxruntime/capi:/host-cuda:/host-nvidia-libs:/host-libs
      - PYTHONPATH=/opt/speech:/usr/lib/python3.10/dist-packages
      - ORT_CUDA_ARENA_EXTEND_STRATEGY=kSameAsRequested
    volumes:
      - speech-models:/opt/models
      # v090 ASR engines (thinker + audio encoder + plugin) land here on first
      # boot. Without a persistent volume every recreate re-downloads ~1.3 GB.
      - edgellm-v090:/opt/edgellm-v090
      - /usr/local/cuda/lib64:/host-cuda:ro
      - /usr/lib/aarch64-linux-gnu/nvidia:/host-nvidia-libs:ro
      - /lib/aarch64-linux-gnu:/host-libs:ro
      - /usr/lib/python3.10/dist-packages/tensorrt:/usr/lib/python3.10/dist-packages/tensorrt:ro
      - /usr/src/tensorrt:/usr/src/tensorrt:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${OVS_MEMORY_LIMIT:-6G}

volumes:
  speech-models:
    name: speech-models
  edgellm-v090:
