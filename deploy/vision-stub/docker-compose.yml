services:
  vision-stub:
    build: .
    image: vision-stub:0.1
    container_name: vision-stub
    restart: unless-stopped
    network_mode: host
    devices:
      - ${CAMERA_DEVICE:-/dev/video0}:${CAMERA_DEVICE:-/dev/video0}
    volumes:
      - ${DATA_DIR:-~/reachy-data}/vision:/app/data
    environment:
      - ZMQ_PUB_PORT=8631
      - HTTP_PORT=8630
      - CAMERA_DEVICE=${CAMERA_DEVICE:-/dev/video0}
      - CAPTURE_DIR=/app/data/captures
      - FACE_DB_DIR=/app/data/faces
      - REST_CTRL_URL=tcp://reachy:18791
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8630/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
