[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-cm4"
version = "0.1.0"
description = "CPU-only vision service for CM4: MediaPipe detection + ONNX emotion (skip-frame)"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=25",
    "msgpack>=1.0",
    "numpy>=1.24,<2",
    "opencv-python-headless>=4.8",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "mediapipe>=0.10",
    "onnxruntime>=1.16",
]

[tool.setuptools]
py-modules = ["producer", "emotion_onnx"]