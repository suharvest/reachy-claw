[project]
name = "reachy-voice"
version = "0.2.0"
description = "Local voice assistant app for Reachy Mini (SLV ASR/TTS + edge-LLM), built on the Reachy Mini app framework"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["reachy-mini-app"]
dependencies = [
    "reachy-mini>=1.8.0",
    # SLV ASR/TTS + edge-LLM + VAD + tools live here (vendored wheel, not on PyPI;
    # resolved from the in-repo wheel via [tool.uv.sources] below):
    "openvoicestream-agent",
    # voxedge is a transitive dep of ovs_agent; declared explicitly so the
    # [tool.uv.sources] vendored-wheel pin below is honored (PyPI release is stale).
    "voxedge",
    "numpy>=2.2.5",
    "websockets>=15.0,<16",
    "httpx>=0.28.0",
    "sounddevice>=0.4.6",
    "onnxruntime>=1.17",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

# Console entry point (optional convenience; the daemon uses the app entry point
# below, not this script). Runs: python -m reachy_voice.main
[project.scripts]
reachy-voice = "reachy_voice.main:main"

# The Reachy Mini daemon discovers and launches apps via this entry-point group.
# It runs the ReachyVoiceApp subclass (python -m reachy_voice.main).
[project.entry-points."reachy_mini_apps"]
reachy_voice = "reachy_voice.main:ReachyVoiceApp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_voice"]

[tool.uv]
override-dependencies = [
    "gstreamer-msvc-runtime>=1.28.1; sys_platform == 'win32'",
    "gstreamer-libs>=1.28.1; sys_platform == 'win32'",
]

[tool.uv.sources]
# Use the in-repo torch-free wheel so the project resolves on any checkout
# (CI, fresh clones, image builds). For live editing of the agent source,
# point this back at an editable sibling path, e.g.
#   { path = "../seeed-local-voice/agent", editable = true }
openvoicestream-agent = { path = "deploy/jetson/reachy/vendor/openvoicestream_agent-0.2.0-py3-none-any.whl" }
# voxedge ships the turn_driver engine that ovs_agent's runner imports. The PyPI
# release is stale, so pin it (transitive via ovs_agent) to the in-repo wheel too.
voxedge = { path = "deploy/jetson/reachy/vendor/voxedge-0.0.1a0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Active suite = the reachy_voice app. The legacy reachy_claw tests under tests/
# (root) target the moved-away code in legacy/ and are kept only for reference.
testpaths = ["tests/voice"]

[tool.ruff.lint]
ignore = ["E402", "E702", "E741", "E731", "E721"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[dependency-groups]
dev = [
    "pytest-aiohttp>=1.1.0",
    "pytest-asyncio>=1.3.0",
]
