[project]
name = "reachy-claw"
version = "0.1.0"
description = "Low-latency voice assistant for Reachy Mini — powered by sherpa-onnx and OpenClaw"
requires-python = ">=3.11"
dependencies = [
    "reachy-mini>=1.2.0",
    "websockets>=12.0",
    "numpy>=1.24",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "openvoicestream-agent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
audio = [
    "sounddevice>=0.4.6",
]
sim = [
    "reachy-mini[mujoco]",
]
vision = [
    "reachy-mini[vision]",
]
local-stt = [
    "openai-whisper>=20231117",
    "faster-whisper>=1.0.0",
]
cloud-stt = [
    "openai>=1.0",
]
piper-tts = [
    "piper-tts>=1.2.0",
]
mediapipe-vision = [
    "mediapipe>=0.10.14",
]
remote-vision = [
    "pyzmq>=25.0",
    "msgpack>=1.0",
]
dashboard = [
    "aiohttp>=3.9",
]

[project.scripts]
reachy-claw = "reachy_claw.main:main"
reachy-claw-clientloop = "reachy_claw.clientloop.run:main"

[project.entry-points."reachy_mini_apps"]
reachy_claw = "reachy_claw.reachy_app:ClawdReachyMiniApp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reachy_claw"]

[tool.uv]
override-dependencies = [
    "gstreamer-msvc-runtime>=1.28.1; sys_platform == 'win32'",
    "gstreamer-libs>=1.28.1; sys_platform == 'win32'",
]

[tool.uv.sources]
# Use the in-repo torch-free wheel so the project resolves on any checkout
# (CI, fresh clones, image builds). For live editing of the agent source,
# point this back at an editable sibling path, e.g.
#   { path = "../seeed-local-voice/agent", editable = true }
openvoicestream-agent = { path = "deploy/jetson/reachy/vendor/openvoicestream_agent-0.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["E402", "E702", "E741", "E731", "E721"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841"]

[dependency-groups]
dev = [
    "pytest-aiohttp>=1.1.0",
    "pytest-asyncio>=1.3.0",
]
